services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: legalsathi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legalsathi_password}
      POSTGRES_DB: legalsathi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - legalsathi-net

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://legalsathi:${POSTGRES_PASSWORD:-legalsathi_password}@db:5432/legalsathi_db
      - SECRET_KEY=${SECRET_KEY:-development_secret_key_change_me}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - FRONTEND_URL=http://localhost:3000
      - RATE_LIMIT_ENABLED=true
    depends_on:
      - db
    networks:
      - legalsathi-net
    volumes:
      - ./backend:/app
      - ./backend/chroma:/app/chroma

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:8000
    depends_on:
      - backend
    networks:
      - legalsathi-net
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:

networks:
  legalsathi-net:
    driver: bridge
